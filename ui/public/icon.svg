<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%"   stop-color="#0a1a3a"/>
      <stop offset="70%"  stop-color="#040a18"/>
      <stop offset="100%" stop-color="#01030a"/>
    </radialGradient>
    <radialGradient id="body" cx="46%" cy="38%" r="62%">
      <stop offset="0%"   stop-color="#9fd0ff" stop-opacity=".95"/>
      <stop offset="42%"  stop-color="#2f7fe0" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#04122e" stop-opacity=".95"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="62%"  stop-color="#2f80ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4a9bff" stop-opacity=".55"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3.2"/></filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- faint outer orbit, as in the reference -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#3f7fd6" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="256" cy="256" r="176" fill="url(#halo)"/>
  <circle cx="256" cy="256" r="158" fill="url(#body)"/>
  <circle cx="256" cy="256" r="158" fill="none" stroke="#cfe6ff" stroke-opacity=".8" stroke-width="2.4"/>

  <!-- interlaced light paths -->
  <g fill="none" stroke="#bcdcff" stroke-opacity=".55" stroke-width="3" filter="url(#soft)">
    <ellipse cx="256" cy="256" rx="150" ry="68" transform="rotate(0 256 256)"/>
    <ellipse cx="256" cy="256" rx="150" ry="68" transform="rotate(45 256 256)"/>
    <ellipse cx="256" cy="256" rx="150" ry="68" transform="rotate(90 256 256)"/>
    <ellipse cx="256" cy="256" rx="150" ry="68" transform="rotate(135 256 256)"/>
  </g>
  <g fill="none" stroke="#e8f4ff" stroke-opacity=".42" stroke-width="2.2">
    <ellipse cx="256" cy="256" rx="104" ry="146" transform="rotate(22 256 256)"/>
    <ellipse cx="256" cy="256" rx="104" ry="146" transform="rotate(-22 256 256)"/>
    <ellipse cx="256" cy="256" rx="146" ry="104" transform="rotate(68 256 256)"/>
  </g>

  <!-- specular highlight -->
  <ellipse cx="206" cy="176" rx="54" ry="32" fill="#f2f8ff" opacity=".3"
           filter="url(#soft)" transform="rotate(-26 206 176)"/>
</svg>
